# packages/crypto test fixtures — synthetic vectors, not secrets
# gitleaks v8: allowlist requires a rule regex/path to attach to.
# Using a broad secret-matching rule whose only purpose is to
# suppress known false-positive test fixtures via allowlist.

[extend]
# use default gitleaks rules

[[rules]]
id = "allow-test-fixtures"
description = "Suppress known synthetic vectors in test directories"
regex = '''(?:abandon( abandon){11}|0x0b{10,}|deadbeef|new Uint8Array\(\d+\)\.fill\(0x[0-9a-fA-F]{2}\))'''

[rules.allowlist]
description = "BIP39 test vectors and fixed test mnemonics"
regexes = [
  '''abandon( abandon){11}''',
  '''(?i)0x0b{10,}''',
  '''(?i)deadbeef''',
]
paths = [
  '''packages/crypto/test/.*''',
  '''packages/core/test/.*''',
  '''packages/react/test/.*''',
  # Published BIP39 test vectors ("abandon … about" / "abandon … art")
  # are standard, synthetic test material — see specs/v1.0.md §10.
  '''specs/test-vectors.json''',
  # Secret-scanning runbook: documents the fixture patterns themselves
  # (e.g. "new Uint8Array(32).fill(0x42)") as examples.
  '''\.github/workflows/README\.md''',
]
