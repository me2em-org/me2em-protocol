packages:
  - 'packages/*'
# cross-package refs keep the workspace: protocol — dev always links the
# CURRENT workspace member, even when packages version at different
# rates. pnpm pack/publish rewrite it to real semver at pack time;
# npm publish cannot ship the protocol — the release flow packs with
# pnpm and publishes the stamped tarballs (see RELEASE.md).
overrides:
  brace-expansion: ^5.0.13
  markdown-it: ^14.3.3
  vite: ^8.3.8
  esbuild: ^0.28.1
  minimatch: ^11.0.1
  typedoc>minimatch: ^10.2.5
onlyBuiltDependencies:
  - esbuild
