packages:
  - 'packages/*'
# workspace members satisfy plain semver ranges too (manifests carry real
# ranges since the npm-publish fix — npm publish does not rewrite
# `workspace:^`, so deps use real versions and pnpm links them locally)
linkWorkspacePackages: true
overrides:
  brace-expansion: ^5.0.13
  markdown-it: ^14.3.3
  vite: ^8.3.8
  esbuild: ^0.28.1
  minimatch: ^11.0.1
  typedoc>minimatch: ^10.2.5
onlyBuiltDependencies:
  - esbuild
